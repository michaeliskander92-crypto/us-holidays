name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Locate project and build
        run: |
          SETTINGS=$(find . -maxdepth 3 -name "settings.gradle.kts" | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found anywhere in the repo."
            echo "The app project files were not uploaded. Files present:"
            find . -maxdepth 2 -not -path "./.git*"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Found project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: US-Holidays-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
